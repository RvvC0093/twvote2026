<!doctype html>
<html lang="zh-Hant" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>找不到頁面 · 2026 拉鋸地圖</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    :root {
      --bg: #0b0f17;
      --card: #121926;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .card {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      padding: 2.5rem 2rem;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
    }
    h1 {
      font-size: 3rem;
      margin: 0 0 0.5rem;
      color: var(--accent);
    }
    h2 {
      font-size: 1.25rem;
      margin: 0 0 1rem;
    }
    p {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin: 0 0 1.5rem;
    }
    a {
      display: inline-block;
      background: var(--accent);
      color: #0b0f17;
      text-decoration: none;
      font-weight: 700;
      padding: 0.65rem 1.4rem;
      border-radius: 999px;
      transition: opacity 0.15s ease;
    }
    a:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>404</h1>
    <h2>找不到該頁面</h2>
    <p>您所查詢的選區或網址不存在。請返回地圖首頁重新探索 2026 選情。</p>
    <a href="./">返回 2026 拉鋸地圖</a>
  </div>
</body>
</html>
